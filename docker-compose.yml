services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:?POSTGRES_DB .env is required}
      POSTGRES_USER:     ${POSTGRES_USER:?POSTGRES_USER .env is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER .env is required} -d ${POSTGRES_DB:?POSTGRES_DB .env is required}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal
    # ports:
    #   - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER .env is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB .env is required}
      SECRET_KEY:   ${SECRET_KEY:?Defina SECRET_KEY no .env}
      ACCESS_TOKEN_EXPIRE_DAYS: ${ACCESS_TOKEN_EXPIRE_DAYS:-15}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  pgdata:
    driver: local

networks:
  internal:
    driver: bridge
